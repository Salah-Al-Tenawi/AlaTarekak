name: alatarekak
description: "عطريقك — منصة مشاركة الرحلات بين المدن."

publish_to: 'none'

# الجزء الأول يراه المستخدم، والذي بعد `+` رقم البناء الذي يميّز نسخة
# عن أخرى. **يُرفع مع كل نسخة تُسلَّم للتجريب**: نسختان بالرقم نفسه لا
# يميّزهما المجرِّب ولا يقبل Google Play الثانية منهما.
version: 1.3.0+9

environment:
  sdk: ^3.10.4

# الإصدارات مثبتة بمدى caret (كانت any) حتى لا يكسر أي pub upgrade البناء.
dependencies:
  badges: ^3.1.2
  cached_network_image: ^3.4.1
  connectivity_plus: ^7.2.0
  cupertino_icons: ^1.0.8
  dartz: ^0.10.1
  dio: ^5.9.0
  dropdown_search: ^6.0.2
  equatable: ^2.0.8
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_map: ^8.2.2
  flutter_rating_bar: ^4.0.1
  flutter_screenutil: ^5.9.3
  flutter_secure_storage: ^10.3.1
  flutter_svg: ^2.2.3
  font_awesome_flutter: 11.0.0
  geocoding: ^4.0.0
  get: ^4.7.3
  get_it: ^9.2.0
  google_fonts: ^8.0.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  image_picker: ^1.2.1
  intl: ^0.20.2
  latlong2: ^0.9.1
  lottie: ^3.3.2
  otp_text_field: ^1.1.3
  salomon_bottom_bar: ^3.3.2
  smooth_page_indicator: ^2.0.1
  pusher_channels_flutter: ^2.6.0
  url_launcher: ^6.3.2
  flutter_local_notifications: ^22.3.0
  geolocator: ^14.0.3

# أيقونة التطبيق — مبنيّة من assets/images/logo.jpg إلى مجلد icon/
#
# خارج assets/ عمداً: `assets/images/` مُعلَن في الحزمة، فوضع ملفّي
# الأيقونة فيه يشحنهما داخل الـAPK بلا فائدة — وهما مدخل بناء لا أصل
# يستعمله التطبيق.
#
# ملفّان لا واحد: أندرويد 8 فأحدث (وminSdk عندنا 26) يقصّ الأيقونة بقناع
# دائري أو مربّع الزوايا ولا يضمن ظهور إلا الثلثين الأوسطين. فالمقدّمة
# تحمل الرسم وحده محصوراً في المنطقة الآمنة، ولون الهوية يملأ ما تحته —
# بينما تبقى الصورة الكاملة للأيقونة التقليدية وiOS.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "icon/app_icon.png"
  min_sdk_android: 26
  remove_alpha_ios: true
  adaptive_icon_background: "#253C5B"
  adaptive_icon_foreground: "icon/app_icon_foreground.png"
  web:
    generate: false

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  # hive_generator أُزيلت مع ترقية Flutter إلى 3.47: الحزمة مهجورة
  # (آخر إصدار يشترط Dart < 3) ولا إصدار منها يتوافق مع flutter_test في
  # الإصدارات الحديثة.
  #
  # لا أثر لذلك على البناء ولا الاختبارات: المحوّل الوحيد في المشروع
  # (user_model.g.dart) مولَّد ومتتبَّع في git. ولإعادة توليده عند تغيير
  # UserModel: أعِد السطر مؤقتاً بإصدار متوافق، أو اكتب المحوّل يدوياً —
  # وهو ثلاثون سطراً.
  integration_test:
    sdk: flutter
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/svgs/
    - assets/lottie/
