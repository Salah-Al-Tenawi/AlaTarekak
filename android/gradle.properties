# ذاكرة عفريت Gradle. القالب يضع 8G — قيمة مكتوبة لأجهزة 32 غيغا، وجهاز
# التطوير هنا 11.7. و4G أوسع ممّا يحتاجه المشروع فعلاً.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError

# ترجمة Kotlin داخل عملية Gradle بدل عفريت منفصل.
#
# عفريت Kotlin يرث وسائط JVM من Gradle ما لم تُضبط `kotlin.daemon.jvmargs`،
# فكان يحاول إطلاق JVM ثانية بالحجم نفسه — أي ضِعف الطلب على جهاز لا يتّسع
# له. فيفشل الاتصال به بعد أربع محاولات، ويرجع المُلحق من تلقائه إلى
# الترجمة الداخلية (`compileWithDaemonOrFallbackImpl`): البناء ينجح والـAPK
# سليم، لكن بعد صفحة أخطاء وأربع محاولات ضائعة في كل مرة.
#
# جعْلُ الرجوع قراراً صريحاً يوفّرها. وكود Kotlin في تطبيق Flutter لا يتعدّى
# `MainActivity` وبضعة ملفات من الحِزَم، فلا يُخسر شيء بغياب العفريت.
kotlin.compiler.execution.strategy=in-process

android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
